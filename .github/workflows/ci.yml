name: CI

on:
  push:
    branches:
      - security/hardening
      - feature/motiba-rebrand
      - main
  pull_request:
    branches:
      - security/hardening
      - main

jobs:
  verify:
    name: Lint, Typecheck, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm run test

      - name: Run security dependency audit
        run: npm run audit

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
